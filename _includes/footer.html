<footer class="site-footer">
  <div class="container">
    <div class="footer-socials">
      {% for s in site.data.socials %}
      <a href="{{ s.url }}" title="{{ s.name }}" aria-label="{{ s.name }}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="{{ s.path }}"/></svg>
      </a>
      {% endfor %}
    </div>
    <p class="footer-note">© {{ 'now' | date: '%Y' }} {{ site.author.name | default: site.title }} · {{ site.author.position }} · Built with Jekyll on GitHub Pages</p>
  </div>
</footer>
